<!DOCTYPE html>

  <head>

    <title>Hello, W&amp;M!</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <!-- ✏️ Step 1: change this heading, save, and watch the preview update -->
      <h1>Hello, W&amp;M!</h1>

      <p class="tagline">
        This is our FreshStart project: a tool that helps W&amp;M students.
      </p>

      <!-- ✏️ Step 2: tell people what your project does -->
      <section>
        <h2>What it does</h2>
        <p>Describe your idea here.</p>
      </section>

      <!-- ✏️ Step 3: put your team's names here -->

        <h2>Our team</h2>

          <li>Teammate 1</li>

    <script src="script.js"></script>
